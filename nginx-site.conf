# SmartBiller Nginx Site Configuration
# This file contains only server blocks for use in /etc/nginx/sites-available/
# The main nginx.conf already has events and http blocks

# Rate limiting zones (these need to be in http context, so they should be in main nginx.conf)
# If not already in main config, add these to /etc/nginx/nginx.conf in the http block:
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Upstream for the Flask application (Docker container)
upstream smartbiller {
    server localhost:5020;  # Changed from web:80 to localhost:5020 for host-level nginx
}

# HTTP server (redirect to HTTPS)
server {
    listen 80;
    server_name smartbiller.co.ke www.smartbiller.co.ke;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name smartbiller.co.ke www.smartbiller.co.ke;

    # SSL configuration (Let's Encrypt certificates)
    ssl_certificate /etc/letsencrypt/live/smartbiller.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartbiller.co.ke/privkey.pem;
    
    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client max body size for file uploads
    client_max_body_size 16M;

    # Static files
    location /static/ {
        alias /home/administrator/smartbiller/app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://smartbiller;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login rate limiting
    location ~ ^/(login|register|tenant_login) {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://smartbiller;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main application
    location / {
        proxy_pass http://smartbiller;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
